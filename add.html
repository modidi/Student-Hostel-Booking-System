<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Hostel</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Add New Hostel</h1>

        <!-- Navigation Menu-->
        <nav>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add.html">Add Hostel</a></li>
                <li><a href="bookings.html">Bookings</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            
            
        </nav>

    </header>

    <!-- Main Section -->
    <main>
        <section>

            <!-- Form To Add Hostel -->
            <form id="hostelForm">

                <!-- Input for hostel name -->
                <input id="name" placeholder="Hostel Name">

                <!-- Input for location -->
                <input id="location" placeholder="Location">

                <!-- Input for price -->
                <input id="price" placeholder="Price">

                <!-- Input for images -->
                <input id="images" placeholder="">

                <!-- Input for decription -->
                <input id="description" placeholder="Description">

                <!-- Submit button -->
                <button type="submit">Add Hostel</button>



            </form>
        </section>
    </main>
    
    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Student Hostel Booking System</p>

    </footer>

    <script src="code.js" defer></script>

</body>
