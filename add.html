<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Hostel</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Add New Hostel</h1>

        <!-- Navigation Menu-->
        <nav>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add.html">Add Hostel</a></li>
                <li><a href="bookings.html">Bookings</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            
            
        </nav>

        <div class="logout-container">
            <button onclick="logout()">Logout</button>
        </div>

    </header>

    <!-- Main Section -->
    <main>

        <!-- Form Section -->
        <section class="form-container">

            <h2> 🏠 Create New Hostel Listing</h2>

            <!-- Form To Add Hostel -->
            <form id="hostelForm">

                <!-- Input for hostel name -->
                <input id="name" placeholder="Hostel Name" required>

                <!-- Input for location -->
                <input id="location" placeholder="Location" required>

                <!-- Input for price -->
                <input id="price" type="number" placeholder="Price (Ksh)" required>

                <!-- Input for description -->
                <input id="description" placeholder="Description">

                <!-- Submit button -->
                <button type="submit"> ➕ Add Hostel</button>

                <!-- Msg shown after submission -->
                <p id="formMsg"></p>

            </form>
        </section>

        <!-- Admin Section -->
        <section class="manage-container">

            <h2> Manage Hostels</h2>

            <!-- Hostels will be inserted inserted here  -->
            <div id="adminHostelList"></div>

        </section>
    </main>
    
    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Student Hostel Booking System</p>

    </footer>

    <script src="code.js" defer></script>

</body>

</html>
