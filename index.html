<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hostel Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header Section -->
    <header>
        <h1>Hostel Booking Website</h1>
    
        <!-- Navigation Menu-->
    <nav>

        <ul>
            
            <li><a href="index.html">Home</a></li>
            <li><a href="add.html">Add Hostel</a></li>
            <li><a href="bookings.html">Bookings</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

    </header>

    <!-- Main Section -->

    <main>

        <section class="hero">

            <h2>Find and Book Hostels Easily</h2>
            <p>Search, compare and book hostels in different locations instantly</p>

        </section>
         
        <!-- Status Section -->
        <section class="stats">

            <div class="stat-box">
                 🏠 Hostels: <span id="totalHostels">0</span>
            </div>

            <div class="stat-box">
                 📅 Bookings: <span id="totalBookings">0</span>
            </div>
           
        </section>
        
        <section class="home-container">
            <!-- Section Heading -->
            <h2>🏠 Available Hostels</h2>

            <div class="controls">
             
            <!-- Price Input -->
             <label>Max Price: <span id="priceValue">10000</span></label>
             <input type="range" min="1000" max="10000" value="10000" oninput="filterPrice(this.value)">

            <!-- Search Dropdown -->
            <select id="hostelSelect" onchange="selectHostel(this.value)">
                <option value="">---Select Hostel</option>
            </select>

            <!-- Hostels will be displayed here -->

            <div id="hostelList"></div>

        </section>
    </main>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times</span>
        <img id="modalImg">
        <p id="modalLabel"></p>
    </div>

    <!-- footer -->
    <footer>
        <p>&copy; 2026 Student Hostel Booking System | All Rights Reserved</p>

    </footer>

    <script src="code.js" defer></script>

</body>

</html>
